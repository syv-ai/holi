name: Harness release monitor

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

concurrency:
  group: harness-monitor
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      report: ${{ steps.discovery.outputs.report }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Discover npm latest versions
        id: discovery
        env:
          HOLI_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/harness-monitor.mjs discover > report.json
          echo "report=$(cat report.json | base64 -w0)" >> "$GITHUB_OUTPUT"

  pi-compatibility:
    needs: discover
    runs-on: ubuntu-24.04
    outputs:
      cli: ${{ steps.cli.outputs.result }}
      consumer: ${{ steps.consumer.outputs.result }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install repository test dependencies
        run: pnpm install --frozen-lockfile
      - name: Install the exact observed Pi package without lifecycle scripts
        env:
          DISCOVERY_REPORT: ${{ needs.discover.outputs.report }}
          npm_config_cache: ${{ runner.temp }}/pi-npm-cache
        run: |
          PI_VERSION="$(echo "$DISCOVERY_REPORT" | base64 --decode | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).providers.find(p=>p.id==="pi").version))')"
          echo "PI_VERSION=$PI_VERSION" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pi-install"
          npm install --prefix "$RUNNER_TEMP/pi-install" --ignore-scripts --no-audit --no-fund "@earendil-works/pi-coding-agent@$PI_VERSION"
      - name: Check isolated exact-version CLI help and version
        id: cli
        run: |
          if node scripts/pi-cli-contract.mjs "$RUNNER_TEMP/pi-install/node_modules/.bin/pi" "$PI_VERSION" > cli-result.json; then
            RESULT="$(cat cli-result.json)"
          else
            RESULT='{"outcome":"mismatch","detail":"Exact observed Pi CLI compatibility probe failed; see this job output."}'
          fi
          echo "result=$(printf '%s' "$RESULT" | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Replay attributed RPC consumer fixtures through PiRpcRun
        id: consumer
        run: |
          if pnpm --filter @holi/desktop exec vitest run src/plugins/agent/test/pi-rpc.test.ts; then
            RESULT="$(node -e 'process.stdout.write(JSON.stringify({outcome:"pass",detail:"Consumer fixture tests passed through PiRpcRun; constructed from upstream RPC documentation/types at b4899f59ef0fba6507c2e619fd804dcde51920ba, not captured from the installed CLI."}))')"
          else
            RESULT="$(node -e 'process.stdout.write(JSON.stringify({outcome:"mismatch",detail:"PiRpcRun consumer fixtures failed; see this compatibility job test output."}))')"
          fi
          echo "result=$(printf '%s' "$RESULT" | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Remove temporary Pi installation
        if: always()
        run: rm -rf "$RUNNER_TEMP/pi-install" "$RUNNER_TEMP/pi-npm-cache"

  codex-check:
    needs: discover
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace for consumer fixtures
        run: pnpm install --frozen-lockfile
      - name: Probe exact npm Codex version without credentials
        env:
          MONITOR_REPORT: ${{ needs.discover.outputs.report }}
        run: |
          echo "$MONITOR_REPORT" | base64 --decode > report.json
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('report.json')).providers.find(p => p.id === 'codex').version)")
          mkdir -p "$RUNNER_TEMP/codex"
          node scripts/codex-compatibility.mjs "$VERSION" > "$RUNNER_TEMP/codex/cli.json" || true
          if pnpm --filter @holi/desktop exec vitest run src/plugins/agent/test/codex-provider.test.ts src/plugins/agent/test/agent-jobs.test.ts; then
            echo '{"name":"fixture consumers","outcome":"pass","detail":"Codex notify and job-event production consumers exercised by attributed fixtures; no provider execution."}' > "$RUNNER_TEMP/codex/fixtures.json"
          else
            echo '{"name":"fixture consumers","outcome":"mismatch","detail":"Codex production-consumer fixture tests failed."}' > "$RUNNER_TEMP/codex/fixtures.json"
          fi
          node -e "const fs=require('fs'); const cli=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/codex/cli.json')); const fixture=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/codex/fixtures.json')); fs.writeFileSync(process.env.RUNNER_TEMP+'/codex/checks.json', JSON.stringify([...cli.checks,fixture]))"
      - uses: actions/upload-artifact@v4
        with:
          name: codex-checks
          path: ${{ runner.temp }}/codex/checks.json
          if-no-files-found: error

  claude-check:
    needs: discover
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace for consumer fixtures
        run: pnpm install --frozen-lockfile
      - name: Probe exact npm Claude Code version without credentials
        env:
          MONITOR_REPORT: ${{ needs.discover.outputs.report }}
        run: |
          echo "$MONITOR_REPORT" | base64 --decode > report.json
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('report.json')).providers.find(p => p.id === 'claude-code').version)")
          mkdir -p "$RUNNER_TEMP/claude"
          node scripts/claude-compatibility.mjs "$VERSION" > "$RUNNER_TEMP/claude/cli.json" || true
          if pnpm --filter @holi/desktop exec vitest run src/plugins/agent/test/claude-sessions.test.ts test/bridge-env.test.ts; then
            echo '{"name":"fixture consumers","outcome":"pass","detail":"Claude listing/history/CLI compatibility fixture plus shipped hook and statusline subprocess consumers passed; agents-2.1.319.json is constructed, not captured. No Claude runtime was executed."}' > "$RUNNER_TEMP/claude/fixtures.json"
          else
            echo '{"name":"fixture consumers","outcome":"mismatch","detail":"Claude listing/history/CLI, shipped hook, or statusline production-consumer tests failed."}' > "$RUNNER_TEMP/claude/fixtures.json"
          fi
          node -e "const fs=require('fs'); const cli=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/claude/cli.json')); const fixture=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/claude/fixtures.json')); const checks=cli.checks.filter(check=>check.name!=='fixture consumers'); checks.push(fixture); fs.writeFileSync(process.env.RUNNER_TEMP+'/claude/checks.json', JSON.stringify(checks))"
      - uses: actions/upload-artifact@v4
        with:
          name: claude-checks
          path: ${{ runner.temp }}/claude/checks.json
          if-no-files-found: error

  report:
    needs: [discover, codex-check, claude-check, pi-compatibility]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: codex-checks
          path: codex-checks
      - uses: actions/download-artifact@v4
        with:
          name: claude-checks
          path: claude-checks
      - name: Reconcile tracking issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MONITOR_REPORT: ${{ needs.discover.outputs.report }}
          PI_CLI_RESULT: ${{ needs.pi-compatibility.outputs.cli }}
          PI_CONSUMER_RESULT: ${{ needs.pi-compatibility.outputs.consumer }}
        run: |
          echo "$MONITOR_REPORT" | base64 --decode > report.json
          echo "$PI_CLI_RESULT" | base64 --decode > pi-cli-result.json
          echo "$PI_CONSUMER_RESULT" | base64 --decode > pi-consumer-result.json
          # Only this reporting job receives the issue-write token. Provider code
          # is installed and executed in separate, read-only compatibility jobs.
          node scripts/harness-monitor.mjs merge-codex report.json codex-checks/checks.json > codex-report.json
          node scripts/harness-monitor.mjs merge-claude codex-report.json claude-checks/checks.json > claude-report.json
          node scripts/harness-monitor.mjs merge-pi claude-report.json pi-cli-result.json pi-consumer-result.json > normalized-report.json
          node scripts/harness-monitor.mjs report normalized-report.json
