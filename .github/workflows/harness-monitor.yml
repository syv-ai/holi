name: Harness release monitor

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

concurrency:
  group: harness-monitor
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      report: ${{ steps.discovery.outputs.report }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Discover npm latest versions
        id: discovery
        env:
          HOLI_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/harness-monitor.mjs discover > report.json
          echo "report=$(cat report.json | base64 -w0)" >> "$GITHUB_OUTPUT"

  pi-compatibility:
    needs: discover
    runs-on: ubuntu-24.04
    outputs:
      cli: ${{ steps.cli.outputs.result }}
      consumer: ${{ steps.consumer.outputs.result }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install repository test dependencies
        run: pnpm install --frozen-lockfile
      - name: Install the exact observed Pi package without lifecycle scripts
        env:
          DISCOVERY_REPORT: ${{ needs.discover.outputs.report }}
          npm_config_cache: ${{ runner.temp }}/pi-npm-cache
        run: |
          PI_VERSION="$(echo "$DISCOVERY_REPORT" | base64 --decode | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).providers.find(p=>p.id==="pi").version))')"
          echo "PI_VERSION=$PI_VERSION" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pi-install"
          npm install --prefix "$RUNNER_TEMP/pi-install" --ignore-scripts --no-audit --no-fund "@earendil-works/pi-coding-agent@$PI_VERSION"
      - name: Check isolated exact-version CLI help and version
        id: cli
        run: |
          node scripts/pi-cli-contract.mjs "$RUNNER_TEMP/pi-install/node_modules/.bin/pi" "$PI_VERSION" > cli-result.json
          echo "result=$(cat cli-result.json | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Replay attributed RPC consumer fixtures through PiRpcRun
        id: consumer
        run: |
          if pnpm --filter @holi/desktop exec vitest run src/plugins/agent/test/pi-rpc.test.ts; then
            RESULT='{"outcome":"pass","detail":"Constructed consumer fixtures replayed through PiRpcRun; attributed to Pi rpc.md and rpc-types.ts at b4899f59ef0fba6507c2e619fd804dcde51920ba, not captured from the latest release."}'
          else
            RESULT='{"outcome":"mismatch","detail":"PiRpcRun consumer fixture tests failed; see this compatibility job's test output."}'
          fi
          echo "result=$(printf '%s' "$RESULT" | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Remove temporary Pi installation
        if: always()
        run: rm -rf "$RUNNER_TEMP/pi-install" "$RUNNER_TEMP/pi-npm-cache"

  report:
    needs: [discover, pi-compatibility]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Reconcile tracking issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MONITOR_REPORT: ${{ needs.discover.outputs.report }}
          PI_CLI_RESULT: ${{ needs.pi-compatibility.outputs.cli }}
          PI_CONSUMER_RESULT: ${{ needs.pi-compatibility.outputs.consumer }}
        run: |
          echo "$MONITOR_REPORT" | base64 --decode > report.json
          echo "$PI_CLI_RESULT" | base64 --decode > pi-cli-result.json
          echo "$PI_CONSUMER_RESULT" | base64 --decode > pi-consumer-result.json
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const report = JSON.parse(readFileSync("report.json", "utf8"));
            const pi = report.providers.find((provider) => provider.id === "pi");
            pi.checks = [
              { name: "cli-contract", ...JSON.parse(readFileSync("pi-cli-result.json", "utf8")) },
              { name: "rpc-consumer", ...JSON.parse(readFileSync("pi-consumer-result.json", "utf8")) },
              { name: "rpc-producer", outcome: "unverified", detail: "No JSONL transcript was captured from the exact npm release; fixtures attributed to upstream revision b4899f59ef0fba6507c2e619fd804dcde51920ba do not prove producer emission." },
            ];
            writeFileSync("report.json", JSON.stringify(report));
          '
          # Only this reporting job receives the issue-write token. Provider code
          # is installed and executed in the separate, read-only compatibility job.
          node scripts/harness-monitor.mjs report report.json
