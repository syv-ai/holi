name: Windows release lifecycle QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-2025:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build source
        run: pnpm --filter @holi/desktop build
      - name: Run Windows release lifecycle QA
        run: node apps/desktop/scripts/windows-release-qa.cjs
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-release-qa-${{ github.run_id }}
          path: windows-release-qa-evidence/
          if-no-files-found: error
          retention-days: 7
