name: Deploy Holi handoff page

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Stage public site files
        run: |
          mkdir -p .tmp/pages-site
          cp site/index.html site/handoff.js site/styles.css .tmp/pages-site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .tmp/pages-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
