# Publish stable releases for new versions and dev prereleases for every main
# commit (docs/features/updates.md).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Serialize reruns of the same commit, but never discard a later push while
  # an earlier release is still building.
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - uses: actions/checkout@v5

      - name: Has this version been released?
        id: version
        run: |
          TAG="v$(node -p 'require("./apps/desktop/package.json").version')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is already released; bump apps/desktop/package.json to ship an update."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build-mac:
    needs: version
    # workflow_dispatch can run on any branch; only main publishes.
    if: needs.version.outputs.exists == 'false' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      # electron-builder rebuilds node-pty for Electron, signs with the
      # Developer ID certificate in CSC_LINK, and notarizes and staples the app
      # before it makes the dmg and zip.
      - name: Package, sign and notarize
        working-directory: apps/desktop
        run: pnpm exec electron-builder --mac --arm64 --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify signature and notarization
        working-directory: apps/desktop
        run: |
          codesign --verify --deep --strict --verbose=2 release/mac-arm64/Holi.app
          spctl --assess --type execute --verbose=2 release/mac-arm64/Holi.app
          xcrun stapler validate release/mac-arm64/Holi.app

      - uses: actions/upload-artifact@v6
        with:
          name: Holi-mac-arm64
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml
          if-no-files-found: error

  build-linux:
    needs: version
    if: needs.version.outputs.exists == 'false' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      # Unsigned: Linux has no platform signature for the updater to check.
      # electron-builder rebuilds node-pty for Electron before the deb and
      # AppImage.
      - name: Package
        working-directory: apps/desktop
        run: pnpm exec electron-builder --linux --x64 --publish never

      - uses: actions/upload-artifact@v6
        with:
          name: Holi-linux-x64
          path: |
            apps/desktop/release/*.deb
            apps/desktop/release/*.AppImage
            apps/desktop/release/latest-linux.yml
          if-no-files-found: error

  build-prerelease-mac:
    # Every main commit gets an isolated prerelease version and feed. Re-runs
    # reuse the run number, tag and release, replacing the same release assets.
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Calculate prerelease version
        id: version
        run: |
          read -r NEXT_PATCH < <(node -e 'const [major, minor, patch] = require("./apps/desktop/package.json").version.split(".").map(Number); console.log(`${major}.${minor}.${patch + 1}`)')
          VERSION="${NEXT_PATCH}-dev.${GITHUB_RUN_NUMBER}"
          echo "next_patch=$NEXT_PATCH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package, sign and notarize
        working-directory: apps/desktop
        # Apple requires numeric bundle versions; preserve the semver prerelease
        # in package.json for electron-updater while using numeric macOS fields.
        run: pnpm exec electron-builder --mac --arm64 --publish never --config.extraMetadata.version="${{ steps.version.outputs.version }}" --config.mac.bundleShortVersion="${{ steps.version.outputs.next_patch }}" --config.mac.bundleVersion="${{ github.run_number }}" --config.publish.channel=dev
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify signature and notarization
        working-directory: apps/desktop
        run: |
          codesign --verify --deep --strict --verbose=2 release/mac-arm64/Holi.app
          spctl --assess --type execute --verbose=2 release/mac-arm64/Holi.app
          xcrun stapler validate release/mac-arm64/Holi.app

      - name: Publish or update prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        # The GitHub API sometimes answers 500 for a moment. Both commands are
        # safe to repeat (an existing release is reused, assets are clobbered),
        # so a failed attempt is retried before the build is thrown away. A new
        # release starts as a draft and is published only once every asset is
        # up, so dev clients never see a dev.N without its dev-mac.yml. gh finds
        # a draft by its pending tag; publishing an already published release
        # (a re-run) changes nothing.
        run: |
          # `set -e` does not apply inside `if publish`, so each command returns.
          publish() {
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" --target "$GITHUB_SHA" --title "Holi $VERSION" --prerelease --draft --generate-notes || return 1
            fi
            gh release upload "$TAG" \
              apps/desktop/release/*.dmg \
              apps/desktop/release/*.zip \
              apps/desktop/release/*.blockmap \
              apps/desktop/release/dev-mac.yml \
              --clobber || return 1
            gh release edit "$TAG" --draft=false
          }
          for attempt in 1 2 3 4; do
            if publish; then exit 0; fi
            if [ "$attempt" -lt 4 ]; then
              echo "Publishing failed (attempt $attempt); retrying in $((attempt * 30))s."
              sleep $((attempt * 30))
            fi
          done
          exit 1

  build-prerelease-linux:
    # The mac job creates and publishes the dev prerelease; this one adds the
    # Linux assets to it once it exists, so the two never race to create it.
    # Until they are up, a Linux dev client's check finds no dev-linux.yml and
    # tries again on the next one.
    needs: build-prerelease-mac
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Package
        working-directory: apps/desktop
        run: pnpm exec electron-builder --linux --x64 --publish never --config.extraMetadata.version="${{ needs.build-prerelease-mac.outputs.version }}" --config.publish.channel=dev

      - name: Upload to the prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build-prerelease-mac.outputs.tag }}
        # Retried for the same reason as the mac job's publish; --clobber makes
        # a re-run replace the same assets.
        run: |
          for attempt in 1 2 3 4; do
            if gh release upload "$TAG" \
              apps/desktop/release/*.deb \
              apps/desktop/release/*.AppImage \
              apps/desktop/release/dev-linux.yml \
              --clobber; then exit 0; fi
            if [ "$attempt" -lt 4 ]; then
              echo "Uploading failed (attempt $attempt); retrying in $((attempt * 30))s."
              sleep $((attempt * 30))
            fi
          done
          exit 1

  build-prerelease-win:
    # Added to the same prerelease as the Linux assets, and for the same
    # reason. Nothing `needs:` this job, so a Windows failure cannot fail or
    # block the mac and Linux jobs, the stable release or the prerelease
    # itself; a Windows dev client then finds no dev.yml for that build and
    # tries again on the next one.
    needs: build-prerelease-mac
    if: github.ref == 'refs/heads/main'
    # Pinned for stability: a runner image change under windows-latest should
    # not change what a release is built on. Nothing here compiles native code.
    runs-on: windows-2022
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      # Unsigned: SmartScreen warns on the first install ("More info", then
      # "Run anyway"). To sign later, add Windows-only secrets to this step's
      # env: WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD, or the AZURE_* variables with
      # win.azureSignOptions (Azure Trusted Signing). Never CSC_LINK: on Windows
      # electron-builder falls back to it, and it is the Apple certificate. Set
      # no publisherName while unsigned: installs that carry one reject every
      # unsigned update. (CSC_IDENTITY_AUTO_DISCOVERY below only affects macOS.)
      # --config.npmRebuild=false: node-pty ships a prebuilt win32-x64 N-API
      # binary that loads in Electron (checked in the packaged app), so there is
      # nothing to compile and no node-gyp or Visual Studio is needed.
      - name: Package
        working-directory: apps/desktop
        run: pnpm exec electron-builder --win nsis --x64 --publish never --config.npmRebuild=false --config.extraMetadata.version="${{ needs.build-prerelease-mac.outputs.version }}" --config.publish.channel=dev
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload to the prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build-prerelease-mac.outputs.tag }}
        # Retried for the same reason as the mac job's publish; --clobber makes
        # a re-run replace the same assets. The feed is dev.yml: on Windows
        # electron-updater names it after the channel, with no platform suffix.
        run: |
          for attempt in 1 2 3 4; do
            if gh release upload "$TAG" \
              apps/desktop/release/*.exe \
              apps/desktop/release/*.exe.blockmap \
              apps/desktop/release/dev.yml \
              --clobber; then exit 0; fi
            if [ "$attempt" -lt 4 ]; then
              echo "Uploading failed (attempt $attempt); retrying in $((attempt * 30))s."
              sleep $((attempt * 30))
            fi
          done
          exit 1

  release:
    needs: [version, build-mac, build-linux]
    # Two commits with the same bumped version can build concurrently. Only
    # one may create the stable tag; a later run observes it and stops.
    concurrency:
      group: stable-${{ needs.version.outputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ needs.version.outputs.tag }}" > /dev/null 2>&1; then
            echo "${{ needs.version.outputs.tag }} is already published."
            exit 0
          fi
          gh release create "${{ needs.version.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "Holi ${{ needs.version.outputs.tag }}" \
            --generate-notes \
            artifacts/*
