# Publish stable releases for new versions and dev prereleases for every main
# commit (docs/features/updates.md).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Serialize reruns of the same commit, but never discard a later push while
  # an earlier release is still building.
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - uses: actions/checkout@v5

      - name: Has this version been released?
        id: version
        run: |
          TAG="v$(node -p 'require("./apps/desktop/package.json").version')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is already released; bump apps/desktop/package.json to ship an update."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build-mac:
    needs: version
    # workflow_dispatch can run on any branch; only main publishes.
    if: needs.version.outputs.exists == 'false' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @holi/desktop build

      # electron-builder rebuilds node-pty for Electron, signs with the
      # Developer ID certificate in CSC_LINK, and notarizes and staples the app
      # before it makes the dmg and zip.
      - name: Package, sign and notarize
        working-directory: apps/desktop
        run: pnpm exec electron-builder --mac --arm64 --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify signature and notarization
        working-directory: apps/desktop
        run: |
          codesign --verify --deep --strict --verbose=2 release/mac-arm64/Holi.app
          spctl --assess --type execute --verbose=2 release/mac-arm64/Holi.app
          xcrun stapler validate release/mac-arm64/Holi.app

      - uses: actions/upload-artifact@v6
        with:
          name: Holi-mac-arm64
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml
          if-no-files-found: error

  build-prerelease-mac:
    # Every main commit gets an isolated prerelease version and feed. Re-runs
    # reuse the run number, tag and release, replacing the same release assets.
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Calculate prerelease version
        id: version
        run: |
          read -r NEXT_PATCH < <(node -e 'const [major, minor, patch] = require("./apps/desktop/package.json").version.split(".").map(Number); console.log(`${major}.${minor}.${patch + 1}`)')
          VERSION="${NEXT_PATCH}-dev.${GITHUB_RUN_NUMBER}"
          echo "next_patch=$NEXT_PATCH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @holi/desktop build

      - name: Package, sign and notarize
        working-directory: apps/desktop
        # Apple requires numeric bundle versions; preserve the semver prerelease
        # in package.json for electron-updater while using numeric macOS fields.
        run: pnpm exec electron-builder --mac --arm64 --publish never --config.extraMetadata.version="${{ steps.version.outputs.version }}" --config.mac.bundleShortVersion="${{ steps.version.outputs.next_patch }}" --config.mac.bundleVersion="${{ github.run_number }}" --config.publish.channel=dev
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify signature and notarization
        working-directory: apps/desktop
        run: |
          codesign --verify --deep --strict --verbose=2 release/mac-arm64/Holi.app
          spctl --assess --type execute --verbose=2 release/mac-arm64/Holi.app
          xcrun stapler validate release/mac-arm64/Holi.app

      - name: Publish or update prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        # The GitHub API sometimes answers 500 for a moment. Both commands are
        # safe to repeat (an existing release is reused, assets are clobbered),
        # so a failed attempt is retried before the build is thrown away. A new
        # release starts as a draft and is published only once every asset is
        # up, so dev clients never see a dev.N without its dev-mac.yml. gh finds
        # a draft by its pending tag; publishing an already published release
        # (a re-run) changes nothing.
        run: |
          # `set -e` does not apply inside `if publish`, so each command returns.
          publish() {
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" --target "$GITHUB_SHA" --title "Holi $VERSION" --prerelease --draft --generate-notes || return 1
            fi
            gh release upload "$TAG" \
              apps/desktop/release/*.dmg \
              apps/desktop/release/*.zip \
              apps/desktop/release/*.blockmap \
              apps/desktop/release/dev-mac.yml \
              --clobber || return 1
            gh release edit "$TAG" --draft=false
          }
          for attempt in 1 2 3 4; do
            if publish; then exit 0; fi
            if [ "$attempt" -lt 4 ]; then
              echo "Publishing failed (attempt $attempt); retrying in $((attempt * 30))s."
              sleep $((attempt * 30))
            fi
          done
          exit 1

  dev-release-alert:
    # A main commit whose dev prerelease failed or was cancelled (a GitHub API
    # error, no macOS runner) leaves the dev channel behind main. Keep one open
    # issue labelled dev-release-failed for it, and close it once a dev
    # prerelease at least as new is published. Runs finish out of order, so a
    # run only speaks for itself: a failure is ignored when a newer dev
    # prerelease already exists, and a success closes the issue only when it is
    # not older than the failure the issue reports.
    needs: build-prerelease-mac
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      contents: read
    steps:
      - name: Open, update or close the dev release issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.build-prerelease-mac.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          LABEL: dev-release-failed
        run: |
          RUN=$GITHUB_RUN_NUMBER
          ISSUE=$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')
          # The run number of the failure the open issue reports, from its marker.
          REPORTED=0
          if [ -n "$ISSUE" ]; then
            REPORTED=$(gh issue view "$ISSUE" --json body --jq '.body' | sed -n 's/.*<!-- dev-run: \([0-9]*\) -->.*/\1/p' | head -n 1)
            REPORTED=${REPORTED:-0}
          fi

          if [ "$RESULT" = success ]; then
            if [ -n "$ISSUE" ] && [ "$RUN" -ge "$REPORTED" ]; then
              gh issue close "$ISSUE" --comment "dev.$RUN for $GITHUB_SHA is published and includes every earlier main commit: $RUN_URL"
            fi
            exit 0
          fi
          if [ "$RESULT" != failure ] && [ "$RESULT" != cancelled ]; then exit 0; fi

          # Newest published dev prerelease run number, from tags like v0.7.1-dev.63.
          NEWEST=$(gh release list --limit 50 --exclude-drafts --json tagName,isPrerelease --jq '[.[] | select(.isPrerelease) | .tagName | capture("-dev\\.(?<n>[0-9]+)$").n | tonumber] | max // 0')
          if [ "$NEWEST" -gt "$RUN" ]; then
            echo "dev.$NEWEST is already published; the channel is ahead of this run."
            exit 0
          fi

          BODY=$(printf '%s\n' \
            "The dev prerelease for \`main\` commit $GITHUB_SHA (dev.$RUN) ended as **$RESULT**, so the dev channel is behind \`main\`." \
            "" \
            "Run: $RUN_URL" \
            "" \
            "Newest published dev prerelease: dev.$NEWEST. Re-run the failed jobs, or push again: the next dev prerelease includes this commit, and this issue closes when one is published." \
            "" \
            "<!-- dev-run: $RUN -->")
          if [ -z "$ISSUE" ]; then
            gh label create "$LABEL" --color d73a4a --description "A dev prerelease on main failed or was cancelled" --force
            gh issue create --title "Dev prerelease failed: the dev channel is behind main" --label "$LABEL" --body "$BODY"
          elif [ "$RUN" -ge "$REPORTED" ]; then
            gh issue edit "$ISSUE" --body "$BODY"
            gh issue comment "$ISSUE" --body "dev.$RUN for $GITHUB_SHA ended as **$RESULT**: $RUN_URL"
          fi

  release:
    needs: [version, build-mac]
    # Two commits with the same bumped version can build concurrently. Only
    # one may create the stable tag; a later run observes it and stops.
    concurrency:
      group: stable-${{ needs.version.outputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ needs.version.outputs.tag }}" > /dev/null 2>&1; then
            echo "${{ needs.version.outputs.tag }} is already published."
            exit 0
          fi
          gh release create "${{ needs.version.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "Holi ${{ needs.version.outputs.tag }}" \
            --generate-notes \
            artifacts/*
