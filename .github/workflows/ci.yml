# Every check the repository relies on, on every push and pull request. A rule that
# is not in this file does not exist (docs/refactor/agent-first.md). The registry of
# what each step enforces is .agents/skills/holi-rules/SKILL.md.
#
# The checks run on Linux on purpose: it is case-sensitive, so an import that only
# resolves on macOS fails there. The tests run on macOS (see the test job). They fake
# the PTY and never launch Electron, so neither the Electron binary nor a rebuilt
# node-pty is needed.
name: CI

on:
  push:
    branches: [main, feat/fresh-frontend, 'refac/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # `pnpm install` would otherwise download ~100 MB of Electron that no check runs.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  checks:
    name: Typecheck, lint, structure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # rulecast --from-ref and the commit-message range need the merge base.
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (layers, styling, motion, plugin seam)
        run: pnpm lint

      - name: Dead code and dependencies (knip)
        run: |
          pnpm knip
          pnpm knip:production

      - name: Which commits does this run cover?
        id: range
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git merge-base origin/main HEAD)"
          fi
          HEAD="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"

      - name: Repository structure (rulecast)
        run: |
          pnpm exec rulecast validate
          pnpm exec rulecast test
          pnpm exec rulecast doctor --ci --from-ref "${{ steps.range.outputs.base }}"
          pnpm exec rulecast run --from-ref "${{ steps.range.outputs.base }}" --to-ref "${{ steps.range.outputs.head }}"

      - name: Format (files changed in this range)
        run: |
          git diff --name-only --diff-filter=ACMR "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}" \
            | xargs --no-run-if-empty pnpm exec prettier --check --ignore-unknown --no-error-on-unmatched-pattern

      - name: Commit messages
        # Off main, commits main already has are main's: a merge from it brings them in
        # without making them this branch's to answer for. On main, nothing is excluded.
        run: |
          EXCLUDE=""
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then EXCLUDE="^origin/main"; fi
          node scripts/check-commit-msg.mjs --range "${{ steps.range.outputs.base }}..${{ steps.range.outputs.head }}" $EXCLUDE

      - name: Pull request title
        # A squash merge makes the PR title main's commit message, so it is held to the
        # same rule before the merge, when it can still be changed.
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-commit-msg.mjs --message "$TITLE"

  ios-format:
    name: iOS vault format (native)
    # Keep native checks independent from Node/pnpm on the dependable Intel pool.
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v5

      - name: Check Swift formatting
        run: xcrun swift-format lint --strict apps/ios/Package.swift apps/ios/Sources/HoliVaultFormat/VaultFormat.swift apps/ios/Tests/HoliVaultFormatTests/VaultFormatTests.swift

      - name: Run host Swift tests
        run: swift test
        working-directory: apps/ios

      - name: Select a compatible iOS Simulator
        id: simulator
        shell: bash
        run: |
          xcodebuild -version
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re, subprocess, sys
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))
          candidates = []
          for runtime, devices in data["devices"].items():
              match = re.fullmatch(r"com\.apple\.CoreSimulator\.SimRuntime\.iOS-(\d+)-(\d+)(?:-(\d+))?", runtime)
              if not match:
                  continue
              version = tuple(int(part or 0) for part in match.groups())
              if version < (26, 0, 0):
                  continue
              for device in devices:
                  if device["name"].startswith("iPhone"):
                      candidates.append((version, device["name"], device["udid"]))
          if not candidates:
              raise SystemExit("No available iPhone simulator on iOS 26 or newer; refusing to skip native tests")
          _, name, udid = sorted(candidates)[0]
          print(f"Selected {name} ({udid})", file=sys.stderr)
          print(f"id={udid}")
          PY

      - name: Build and test for iOS Simulator
        run: >-
          xcodebuild -scheme HoliVaultFormat
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}'
          -parallel-testing-enabled NO
          CODE_SIGNING_ALLOWED=NO test
        working-directory: apps/ios

  test:
    name: Test
    # macOS on purpose: the tests encode the filesystem Holi ships on (macOS and
    # Windows are case-insensitive; path-safety's exact-case check needs that), and
    # the vault watcher tests were tuned on fsevents. The checks job above stays on
    # Linux, where a wrongly cased import fails.
    # Pin Intel: the hosted ARM64 pool can cancel jobs before acquiring a runner.
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The node suite creates real repositories and commits in them.
      - name: Git identity for the tests
        run: |
          git config --global user.name "Holi CI"
          git config --global user.email "ci@holi.invalid"
          git config --global init.defaultBranch main

      - name: Test
        # Leave CPU capacity for the serial filesystem/git suite beside jsdom.
        run: pnpm test --maxWorkers=2
