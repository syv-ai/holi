name: Mobile iOS compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Test mobile change detection
        run: node --test .github/workflows/mobile-ios-changes.test.mjs
      - name: Detect mobile compatibility inputs
        id: detect
        run: node .github/workflows/mobile-ios-changes.mjs

  # Keep this exact legacy status name for existing branch protection. Its PR check is
  # portable only; native simulator coverage is deferred to main/manual dispatch.
  simulator:
    name: Unsigned NativeScript simulator
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      TZ: UTC
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Fail if change detection failed
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Skip summary for unrelated changes
        if: needs.changes.outputs.run != 'true'
        run: echo 'Mobile compatibility skipped; no relevant inputs changed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v5
        if: needs.changes.outputs.run == 'true'
      - uses: pnpm/action-setup@v5
        if: needs.changes.outputs.run == 'true'
        with:
          version: 10.8.1
      - uses: actions/setup-node@v5
        if: needs.changes.outputs.run == 'true'
        with:
          node-version: 24
          cache: pnpm
      - name: Install only mobile and shared dependencies
        if: needs.changes.outputs.run == 'true'
        run: pnpm --filter @holi/mobile... install --frozen-lockfile
      - name: Check portable mobile and shared modules
        if: needs.changes.outputs.run == 'true'
        run: |
          pnpm --filter @holi/shared typecheck
          pnpm --filter @holi/shared test
          pnpm --filter @holi/mobile typecheck
          pnpm --filter @holi/mobile lint
          pnpm --filter @holi/mobile test
      - name: Native simulator coverage deferred
        if: needs.changes.outputs.run == 'true'
        run: echo 'This status covers portable checks only. Native iOS verification runs separately on main/manual dispatch, never on pull requests.' >> "$GITHUB_STEP_SUMMARY"

  native:
    name: Native iOS simulator
    needs: changes
    if: >-
      needs.changes.result == 'success' && needs.changes.outputs.run == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: macos-15
    timeout-minutes: 20
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      TZ: UTC
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      HOLI_IOS_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-2
      HOLI_IOS_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
      HOLI_IOS_ARTIFACTS: /tmp/holi-265-ci
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 10.8.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install only mobile and shared dependencies
        run: pnpm --filter @holi/mobile... install --frozen-lockfile
      - name: NativeScript Ruby project adapter and native build tools
        run: |
          gem install --user-install xcodeproj -v 1.28.1 --no-document
          cmake --version
          git --version
          openssl version
          tar --version
          xcrun --sdk iphonesimulator --show-sdk-path
      - name: Build, install, launch and verify the actual native runtime
        run: pnpm --filter @holi/mobile test:ios
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: mobile-ios-compatibility
          path: /tmp/holi-265-ci
          if-no-files-found: warn

  native-archive:
    name: Native iOS unsigned archive
    needs: changes
    if: >-
      needs.changes.result == 'success' && needs.changes.outputs.run == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: macos-15
    timeout-minutes: 25
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      TZ: UTC
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 10.8.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install only mobile and shared dependencies
        run: pnpm --filter @holi/mobile... install --frozen-lockfile
      - name: Native build tools
        run: |
          gem install --user-install xcodeproj -v 1.28.1 --no-document
          cmake --version
          xcrun --sdk iphoneos --show-sdk-path
      - name: Build and verify unsigned device archive
        run: pnpm --filter @holi/mobile archive:ios
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: mobile-ios-unsigned-archive
          path: apps/mobile/.artifacts/ios
          include-hidden-files: true
          if-no-files-found: warn
