# Package Holi for GitHub release updates (docs/features/updates.md).
appId: ai.syv.holi
productName: Holi
# The installed app is named Holi: its menu, and its own userData folder. Not
# in package.json, so `pnpm dev` keeps the dev build's separate userData.
extraMetadata:
  productName: Holi
directories:
  output: release
files:
  - out/**/*
  - package.json
  # The meeting VAD runs onnxruntime-web's plain wasm build in main; its other
  # builds (WebGPU, WebGL, JSEP, JSPI, asyncify), sources and maps are about
  # 125 MB that nothing loads.
  - '!**/node_modules/onnxruntime-web/{docs,lib}/**'
  - '!**/node_modules/onnxruntime-web/dist/*.map'
  - '!**/node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.{asyncify,jsep,jspi}.*'
  - '!**/node_modules/onnxruntime-web/dist/ort.{all,bundle,jspi,webgl,webgpu,wasm}.*'
  - '!**/node_modules/onnxruntime-web/dist/ort.{js,mjs,min.js,min.mjs}'
asarUnpack:
  # A native module and its spawn helper are executed, so they cannot live
  # inside the asar archive.
  - '**/node_modules/node-pty/**'
  # sharp's native libvips binding, for the shrink-images commit transform.
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'
  # The PDF plugin hands pdfium's wasm to the engine by path.
  - '**/node_modules/@embedpdf/pdfium/**'
  # The meeting VAD imports onnxruntime-web's wasm loader by path.
  - '**/node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.*'
# Holi links (docs/features/holi-links.md): the OS hands a clicked `holi://`
# link to the app.
protocols:
  - name: Holi link
    schemes: [holi]
publish:
  # CI selects channel=dev for prereleases; stable uses latest-mac.yml.
  provider: github
  owner: syv-ai
  repo: holi
mac:
  target:
    # The dmg is what a person downloads; the zip and latest-mac.yml are what
    # the updater downloads.
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.productivity
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
linux:
  target:
    # The deb installs Holi into the app menu and registers holi:// links; the
    # AppImage runs without installing. electron-updater updates both from
    # latest-linux.yml (the deb through pkexec, asking for a password).
    - target: deb
      arch: [x64]
    - target: AppImage
      arch: [x64]
  category: Office
  executableName: holi
  # A deb names a maintainer with an email; package.json's author has none.
  maintainer: syv.ai <syv-ai@users.noreply.github.com>
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
