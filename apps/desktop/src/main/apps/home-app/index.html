<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Home</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        background: var(--background);
        color: var(--foreground);
        font:
          13px/1.5 system-ui,
          sans-serif;
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
      }
      section {
        width: min(22rem, 100%);
      }
      h2 {
        margin: 0 0 0.5rem;
        font-size: 11px;
        font-weight: 500;
        color: var(--muted-foreground);
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      button {
        all: unset;
        display: flex;
        gap: 0.75rem;
        width: 100%;
        padding: 0.3rem 0.5rem;
        margin: 0 -0.5rem;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover,
      button:focus-visible {
        background: var(--accent);
      }
      .name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .where {
        margin-left: auto;
        flex-shrink: 0;
        color: var(--muted-foreground);
      }
      footer {
        padding: 1.5rem 1rem;
        text-align: center;
        color: var(--muted-foreground);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <section id="recents" hidden>
        <h2>Recently opened</h2>
        <ul></ul>
      </section>
    </main>
    <footer>You can customize this page. Explain your vision to the vault assistant</footer>
    <script src="home.js"></script>
  </body>
</html>
