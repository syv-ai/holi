<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!--
      A deliberately narrow CSP — every directive here forbids something the app
      never does, so it costs nothing and holds in dev and in a packaged build
      alike.

      What it is NOT: an XSS defence. `script-src` is absent on purpose, because
      Vite's dev server injects an inline module preamble, so the only policy
      that would work in dev is one carrying `'unsafe-inline'` — which stops
      nothing and reads like protection. The app's real script defence is that
      the one untrusted string it renders as markup (a mail body) goes through
      DOMPurify first, and lands in a sandboxed frame rather than in this
      document at all: renderer/src/lib/{mail-html,mail-frame}.ts.

      What it IS: the second layer under that sanitizer. If a bypass ever landed
      an <object> in a message, a <base> that silently retargeted every relative
      URL, or a <form> that posted somewhere, these are what keep it inert.

      NO frame-src/child-src here, deliberately. The app renders one iframe on
      purpose — a mail message's own document — and whether frame-src blocks an
      about:blank frame is exactly the kind of thing that works in dev and fails
      in a packaged build. Framing is constrained where it actually matters
      instead: that frame's document declares `default-src 'none'`, so the
      message inside it cannot frame anything at all.

      Remote images are deliberately NOT restricted here: blocking them is the
      sanitizer's job plus the frame's own img-src, per message, so that "load
      images" can work at all.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Holi</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
