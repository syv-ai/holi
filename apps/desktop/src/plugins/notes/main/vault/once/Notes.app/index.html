<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app" class="show-list">
      <aside id="side">
        <header class="side-head">
          <div>
            <div class="h-title">Notes</div>
            <div class="h-sub" id="count">…</div>
          </div>
          <button id="new" class="round" title="New note" aria-label="New note">✎</button>
        </header>
        <input id="q" type="search" placeholder="Search" />
        <div id="list" class="grows"></div>
      </aside>
      <main id="main">
        <header class="main-head">
          <button id="back" class="round" aria-label="Back to notes">‹</button>
          <div id="stamp"></div>
          <button id="del" class="round" title="Delete note" aria-label="Delete note">🗑</button>
        </header>
        <textarea id="body" placeholder="Start typing…" spellcheck="true"></textarea>
        <div id="empty">No note selected</div>
      </main>
    </div>
    <p class="err" id="err"></p>
    <script src="app.js"></script>
  </body>
</html>
