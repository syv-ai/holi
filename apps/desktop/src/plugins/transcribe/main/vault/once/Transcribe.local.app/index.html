<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="deck" id="rec" data-state="idle">
      <div class="top">
        <button id="recBtn" class="morph" aria-label="Start recording"><span class="ring"></span><span class="core"></span></button>
        <div class="info">
          <span class="tag" id="tag">Ready</span>
          <span class="time" id="timer">00:00</span>
        </div>
        <canvas id="wave" class="wave"></canvas>
      </div>
      <div class="sources">
        <label class="switch"><input type="checkbox" id="useMic" checked /><span class="track"></span><span>My microphone</span></label>
        <label class="switch"><input type="checkbox" id="useSys" checked /><span class="track"></span><span>Meeting audio <small class="muted">(computer sound)</small></span></label>
      </div>
      <p class="muted status" id="status">Ready.</p>
      <div class="meter" hidden><div id="level"></div></div>
    </section>

    <details class="card" id="cfg">
      <summary>Transcription service</summary>
      <label>Endpoint <input id="url" value="https://platform.syv.ai/v1" /></label>
      <label>Model <input id="model" value="syv-transcribe" /></label>
      <label>Language <input id="lang" value="da" /></label>
      <label>API key <input id="key" type="password" placeholder="HVISKE_API_KEY" /></label>
      <button id="saveCfg">Save</button>
    </details>

    <div class="grows" id="meetings"></div>
    <p class="err" id="err"></p>
    <script src="app.js"></script>
  </body>
</html>
