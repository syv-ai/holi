<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Open in Holi</title>
    <link rel="stylesheet" href="/holi/styles.css" />
    <script type="module" src="/holi/handoff.js"></script>
  </head>
  <body>
    <main class="card" aria-labelledby="title">
      <div class="brand" aria-hidden="true">H</div>
      <p class="eyebrow">A note shared with you</p>
      <h1 id="title">Open this destination in Holi</h1>
      <p id="destination" class="destination">Checking link…</p>
      <p id="message" class="message" role="status" aria-live="polite"></p>
      <a id="open" class="button" href="#" hidden>Open in Holi</a>
      <p class="install">
        Holi must be installed, and this vault and file must be available on your device.
      </p>
      <p class="privacy">
        This page only hands the link to Holi. It cannot read your vault or its contents.
      </p>
    </main>
  </body>
</html>
